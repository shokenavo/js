<!DOCTYPE html>
<html>

<head>
  <link rel="prevgdfvbconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/myproject/styles/shared/general.css">
  <link rel="stylesheet" href="/myproject/styles/shared/header.css">
  <link rel="stylesheet" href="/myproject/styles/page/main-one.css">
  <title>amazon</title>
</head>

<body>
  <header class="header">
    <a href="amazon.html" class="div_1-header header-links">
      <picture class="img_1-header">
        <source media="(max-width:800px)" srcset="/myproject/images/amazon-mobile.png">
        <img  src="/myproject/images/amazon-pc.png" alt="Logo">
      </picture>
    </a>
    <div class="search-div"><input class="input-header" type="text" placeholder="Search">
      <button class="search-button"><img class="search-img" src="/myproject/images/search-icon.png"></button>
    </div>
    <div class="right-div-header">
      <a href="/myproject/orders.html" class="return-order">Returns <span class="span-header">& Orders</span></a>
      <a class="cart-header" href="/myproject/checkout.html"><img class="cart-img" src="/myproject/images/cart-icon.png">
        <div class="cart-number-div">
          <p class="cart-number-p">3</p>
        </div>
        <p class="p-of-cart">Cart</p>
      </a>
    </div>

  </header>
  <main>
    <!-- محصول اول -->
    <div class="products-grid">
      <div class="product-container">
        <div class="grid-img-div"><img class="grid-img" src="/myproject/images/athletic-cotton-socks-6-pairs.jpg"></div>
        <div class="nameof-product">Black and Gray Athletic Cotton Socks - 6 Pairs</div>
        <div class="rating"><img class="star-model-rate" src="/myproject/images/rating-45.png">
          <div class="rate-number">87</div>
        </div>
        <div class="price-div">$10.90 </div>
        <select id="quantity" name="quantity">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
        <div class="adding-button-div"><button class="adding-button">Add to Cart</button></div>
      </div>
      <!-- محصول دوم -->
      <div class="product-container">
        <div class="grid-img-div"><img class="grid-img" src="/myproject/images/intermediate-composite-basketball.jpg">
        </div>
        <div class="nameof-product">Intermediate Size Basketball </div>
        <div class="rating"><img class="star-model-rate" src="/myproject/images/rating-40.png">
          <div class="rate-number">127</div>
        </div>
        <div class="price-div">$20.95 </div>
        <select id="quantity" name="quantity">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
        <div class="adding-button-div"><button class="adding-button">Add to Cart</button></div>
      </div>
      <!-- محصول سوم -->
      <div class="product-container">
        <div class="grid-img-div"><img class="grid-img"
            src="/myproject/images/adults-plain-cotton-tshirt-2-pack-teal.jpg"></div>
        <div class="nameof-product">Adults Plain Cotton T-Shirt - 2 Pack </div>
        <div class="rating"><img class="star-model-rate" src="/myproject/images/rating-45.png">
          <div class="rate-number">56</div>
        </div>
        <div class="price-div">$7.99 </div>
        <select id="quantity" name="quantity">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
        <div class="adding-button-div"><button class="adding-button">Add to Cart</button></div>
      </div>
    </div>

  </main>
</body>

</html>
