<!DOCTYPE html>
<html>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/myproject/styles/shared/general.css">
  <link rel="stylesheet" href="/myproject/styles/shared/header.css">
  <link rel="stylesheet" href="/myproject/styles/page/tracking.css">
  <title>Tracking</title>
</head>

<body>

  <header class="header">
    <a href="amazon.html" class="div_1-header header-links">
      <picture class="img_1-header">
        <source media="(max-width:800px)" srcset="/myproject/images/amazon-mobile.png">
        <img src="/myproject/images/amazon-pc.png" alt="Logo">
      </picture>
    </a>
    <div class="search-div"><input class="input-header" type="text" placeholder="Search">
      <button class="search-button"><img class="search-img" src="/myproject/images/search-icon.png"></button>
    </div>
    <div class="right-div-header">
      <a href="/myproject/orders.html" class="return-order">Returns <span class="span-header">& Orders</span></a>
      <a class="cart-header" href="/myproject/checkout.html"><img class="cart-img"
          src="/myproject/images/cart-icon.png">
        <div class="cart-number-div">
          <p class="cart-number-p">3</p>
        </div>
        <p class="p-of-cart">Cart</p>
      </a>
    </div>

  </header>
  <main>
    <div class="order-tracking">
      <a class="view-of-pro" href="/myproject/orders.html">View all orders</a>
      <div class="arrive-time">Arriving on Monday, June 13</div>
      <div class="pro-name">Black and Gray Athletic Cotton Socks - 6 Pairs</div>
      <div class="quantity">Quantity: 1</div>
      <div class="pro-img-div"><img class="pro-img" src="/myproject/images/athletic-cotton-socks-6-pairs.jpg"></div>
      <div class="delivery-situ">Preparing<span class="shipping">Shipped</span>Delivered</div>
      <div class="loading-container">
        <div class="loading"></div>
      </div>
    </div>
  </main>
</body>

</html>
