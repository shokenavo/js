<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      background: linear-gradient(135deg,
          #ebc8d0 0%,
          #FFD6E8 45%,
          #FCE4F6 100%);
    }

    .main-one {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .yes-button {
      background: #F8B4B4;
      --direction: -50px;
      color: #CFE8FF;
      transition: transform 3s;
    }

    .no-button {
      background: #CFE8FF;
      color: #F8B4B4;

      position: fixed;
      /* یا absolute */
      transition: left 0.2s ease, top 0.2s ease;
    }

    .yes-button,
    .no-button {
      border: 1px gray solid;
      height: 180px;
      width: 200px;
      margin: 0px 10px;
      border-radius: 15px;
      font-size: 28px;
    }

    button {
      animation: yes-no 2s infinite ease-in-out;
    }

    /*@keyframes yes-no {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(var(--direction));
      }

    }

    .bigYes {
      transform: scale(4);

    }*/
  </style>
</head>

<body>
  <div class="main-one">
    <div class="yes"><button class="yes-button">اره</button></div>
    <div class="no"><button class="no-button">نچ</button></div>

  </div>



  <script>
    let yes = document.querySelector('.yes-button');
    let no = document.querySelector('.no-button');
    /*no.addEventListener('click', ()=>{
      no.style.animation = 'none';
      yes.style.animation = "none";
      yes.classList.add('bigYes');
    })*/
    yes.addEventListener('click',()=>{
      alert('با تشکر زمان دیت برای شما ارسال میشود (×-|-×)')
    })
   
    document.addEventListener('mousemove', (e) => {
      const rect = no.getBoundingClientRect();

      const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
      );

      if (distance < 120) {
        no.style.left =
          Math.random() * (window.innerWidth - no.offsetWidth) + 'px';

        no.style.top =
          Math.random() * (window.innerHeight - no.offsetHeight) + 'px';
      }
    });
  </script>













</body>

</html>
