<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(135deg,
          #ebc8d0 0%,
          #FFD6E8 45%,
          #FCE4F6 100%);
    }

    .main-one {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .yes-button {
      background: #F8B4B4;
      --direction: -50px;
      color: #CFE8FF;
      transition: transform 3s;
    }

    .no-button {
      background: #CFE8FF;
      color: #F8B4B4;

      position: fixed;
      /* یا absolute */
      transition: left 0.2s ease, top 0.2s ease;
    }

    .yes-button,
    .no-button {
      border: 1px gray solid;
      height: 180px;
      width: 200px;
      margin: 0px 10px;
      border-radius: 15px;
      font-size: 28px;
    }

    .text-div {
      position: fixed;
      top: 100px;
      left: auto;
      right: auto;
      border: 2px solid lightblue;
      width: 800px;
      height: 80px;
      background: lightsalmon;
      font-size: 40px;
      text-align: center;
      padding-top: 30px;
      color: rgb(0, 45, 248);
    }
  </style>
</head>

<body>
  <div class="main-one">
    <div class="text-div">ایا با من دیت میای ؟</div>
    <div class="yes"><button class="yes-button">اره</button></div>
    <div class="no"><button class="no-button">نچ</button></div>

  </div>



  <script>
    let yes = document.querySelector('.yes-button');
    let no = document.querySelector('.no-button');

    yes.addEventListener('click', () => {
      alert('با تشکر زمان دیت برای شما ارسال میشود (×-|-×)')
    })

    document.addEventListener('mousemove', (e) => {
      const rect = no.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const distance = Math.hypot(
        e.clientX - centerX,
        e.clientY - centerY
      );

      if (distance < 250) { // قبلاً 120 بود
        const padding = 50;

        const x = Math.random() * (window.innerWidth - no.offsetWidth - padding * 2) + padding;
        const y = Math.random() * (window.innerHeight - no.offsetHeight - padding * 2) + padding;

        no.style.left = `${x}px`;
        no.style.top = `${y}px`;
      }
    });
  </script>













</body>

</html>
